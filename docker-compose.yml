services:
  db:
    image: postgres:16-alpine
    container_name: gpu_portal_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpu_password}
      POSTGRES_DB: ${POSTGRES_DB:-gpu_allocator}
    ports:
      - "5470:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpu_user} -d ${POSTGRES_DB:-gpu_allocator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gpu_portal_backend
    restart: always
    expose:
      - "8010"
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gpu_user}:${POSTGRES_PASSWORD:-gpu_password}@db:5432/${POSTGRES_DB:-gpu_allocator}
      PORT: 8010
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-gpu_allocator_prod_secret_key_9837498234729}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}
      ESCALATION_TIMEOUT_MINUTES: ${ESCALATION_TIMEOUT_MINUTES:-60}
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gpu_portal_frontend
    restart: always
    expose:
      - "3000"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws/status}
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    container_name: gpu_portal_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
