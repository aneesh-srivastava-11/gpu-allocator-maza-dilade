services:
  - type: web
    name: gpu-allocator-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8010
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-frontend-app.vercel.app"
